name: Build MK-Mail Windows x64 MSI

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

env:
  VCPKG_DEFAULT_TRIPLET: x86-windows
  VCPKG_DEFAULT_HOST_TRIPLET: x86-windows
  VCPKG_OVERLAY_PORTS: ${{ github.workspace }}/mailsync/vcpkg-overlay-ports

jobs:
  build-msi:
    name: Build Windows x64 MSI
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '84bab45d415d22042bd0b9081aea57f362da3f35'
          runVcpkgInstall: false
          doNotCache: true

      - name: Enable vcpkg MSBuild integration
        run: vcpkg integrate install

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: mailsync/vcpkg_installed
          key: vcpkg-msbuild-x86-windows-${{ hashFiles('mailsync/vcpkg.json', 'mailsync/vcpkg-configuration.json', 'mailsync/vcpkg-overlay-ports/**') }}

      - name: Install VC2010 redistributable
        shell: cmd
        run: choco install -y vcredist2010

      - name: Build Mailsync with POP3 Support (MSBuild)
        shell: cmd
        run: |
          cd mailsync\Windows
          msbuild.exe mailsync.sln /property:Configuration=Release;Platform=Win32 /p:VcpkgEnableManifest=true

      - name: Deploy Mailsync binaries and dependencies to app/
        shell: pwsh
        run: |
          Write-Host "=== Deploying mailsync.exe and DLLs to app/ ==="

          # 1. Copy only runtime binaries (exe + dll) from Release into app/.
          # Previously Copy-Item Release\* also shipped .pdb/.exp/.lib/.ilk
          # (~100 MB+) which electron-packager unpacks via asar '*.pdb'
          # and WiX then packs into the MSI - see build.js ignore list.
          if (Test-Path ".\mailsync\Windows\Release") {
            Copy-Item ".\mailsync\Windows\Release\*.exe" -Destination ".\app" -Force -ErrorAction SilentlyContinue
            Copy-Item ".\mailsync\Windows\Release\*.dll" -Destination ".\app" -Force -ErrorAction SilentlyContinue
          } else {
            Write-Host "ERROR: mailsync\Windows\Release not found!"
            exit 1
          }
          # Belt-and-braces: prune any debug artifacts that slipped in
          $pruned = @(Get-ChildItem ".\app" -File -Include *.pdb,*.exp,*.lib,*.ilk,*.iobj,*.ipdb -ErrorAction SilentlyContinue)
          if ($pruned.Count -gt 0) {
            $prunedBytes = ($pruned | Measure-Object Length -Sum).Sum
            Write-Host "Pruned $($pruned.Count) debug artifact(s) from app/ ($([math]::Round($prunedBytes/1MB,2)) MB)"
            $pruned | Remove-Item -Force
          }

          if (-not (Test-Path ".\app\mailsync.exe")) {
            Write-Host "ERROR: app\mailsync.exe was not created!"
            exit 1
          }
          Write-Host "SUCCESS: mailsync.exe found in app/."

          # 2. Copy DLLs from vcpkg installed directories
          $vcpkgDirs = @(
            ".\mailsync\vcpkg_installed\x86-windows\bin",
            ".\mailsync\vcpkg_installed\x86-windows\x86-windows\bin"
          )
          foreach ($dir in $vcpkgDirs) {
            if (Test-Path $dir) {
              Copy-Item "$dir\*.dll" -Destination ".\app" -Force -ErrorAction SilentlyContinue
            }
          }

          # 3. Copy SASL plugins for SMTP authentication
          $saslDirs = @(
            ".\mailsync\vcpkg_installed\x86-windows\x86-windows\bin\sasl2",
            ".\mailsync\vcpkg_installed\x86-windows\bin\sasl2"
          )
          foreach ($dir in $saslDirs) {
            if (Test-Path $dir) {
              Copy-Item "$dir\sasl*.dll" -Destination ".\app" -Force -ErrorAction SilentlyContinue
              Write-Host "Copied SASL plugins from $dir"
            }
          }

          # 4. Copy MSVC runtime DLLs
          $msvcDlls = @("msvcr100.dll", "msvcr120.dll", "msvcp100.dll", "msvcp120.dll", "msvcp140.dll", "vcruntime140.dll")
          foreach ($dll in $msvcDlls) {
            $p = Join-Path "C:\Windows\SysWOW64" $dll
            if (Test-Path $p) {
              Copy-Item $p ".\app\" -Force -ErrorAction SilentlyContinue
            }
          }

          # 5. Copy UCRT DLLs (dlls only - avoid manifests etc)
          $ucrtPath = "C:\Program Files (x86)\Windows Kits\10\Redist\ucrt\DLLs\x86"
          if (Test-Path $ucrtPath) {
            Copy-Item "$ucrtPath\*.dll" ".\app\" -Force -ErrorAction SilentlyContinue
          }

          # 6. zlib naming workaround (vcpkg provides zlib1.dll, some imports expect zlib.dll)
          if (Test-Path ".\app\zlib1.dll") {
            Copy-Item ".\app\zlib1.dll" ".\app\zlib.dll" -Force
          }

          Write-Host "=== Contents of app/ (DLLs and EXEs) ==="
          Get-ChildItem ".\app\*.dll", ".\app\*.exe" | Select-Object Name

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Package Electron App (Packager)
        run: npm run build
        env:
          DEBUG: electron-packager

      - name: Verify and sync mailsync in package
        shell: pwsh
        run: |
          $unpacked = "app\dist\mailspring-win32-x64\resources\app.asar.unpacked"
          if (Test-Path $unpacked) {
            Copy-Item ".\app\mailsync.exe" -Destination "$unpacked" -Force
            Copy-Item ".\app\*.dll" -Destination "$unpacked" -Force
            Write-Host "Synced mailsync.exe and DLLs to $unpacked"
          }

      - name: Setup WiX Toolset
        shell: pwsh
        run: |
          $wixPath = "C:\Program Files (x86)\WiX Toolset v3.11\bin"
          if (-not (Test-Path (Join-Path $wixPath "candle.exe"))) {
            Write-Host "Installing WiX via Chocolatey..."
            choco install wixtoolset -y
          }
          if (Test-Path $wixPath) {
            echo "$wixPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Build Windows x64 MSI Installer
        shell: pwsh
        run: |
          & .\app\build\msi\create-msi.ps1

      - name: Upload MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MK-Mail-Setup-x64-msi
          path: app/dist/MK-Mail-Setup-x64.msi
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pop3-latest
          name: "MK-Mail Windows x64 MSI with POP3 Support"
          prerelease: false
          body: |
            ## MK-Mail for Windows x64 (MSI Installer) with POP3 & SMTP Support

            ### Features:
            - **Native Windows x64 MSI Installer**: Installs natively to `Program Files\MK-Mail` with desktop and start menu shortcuts.
            - **Native POP3 Engine (C++)**: Full POP3 implementation in `mailsync` using `libetpan` with SSL/TLS, UIDL tracking in SQLite, RFC822 parsing, and direct SMTP sent-box save.
            - **Modern POP3 Setup UI**: Direct POP3 account setup form & provider option in Mailspring onboarding.

            ### Downloads:
            - **`MK-Mail-Setup-x64.msi`**: Official Windows x64 MSI Installer.
          files: |
            app/dist/MK-Mail-Setup-x64.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
